name: Publish to PyPI

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: pypi-faultlinedetectionrobotics
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish faultlinedetectionrobotics
    runs-on: ubuntu-latest

    environment:
      name: pypi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install build backend
        run: python -m pip install build

      - name: Build faultlinedetectionrobotics
        run: python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: faultlinedetectionrobotics-distributions
          path: dist/

      - name: Publish faultlinedetectionrobotics to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
