[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "FLDR"
version = "0.0.1"
description = "Pipeline inspection and fault detection framework."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

authors = [
    { name = "Asif Kazi", email = "kazisaadasif29@gmail.com" },
]

keywords = [
    "pipeline",
    "pipeline-inspection",
    "fault-detection",
    "robotics",
    "computer-vision",
    "lidar",
    "sensor-fusion",
    "slam",
    "inspection",
    "mapping",
    "autonomous-systems",
    "machine-learning",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Environment :: Console",
    "Framework :: Typer",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "typer>=0.17,<1.0",
]

[project.optional-dependencies]

dev = [
    "black>=25.1.0",
    "ruff>=0.12.0",
    "flake8>=7.1.0",
    "flake8-pyproject>=1.2.3",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",
    "bandit[toml]>=1.8.0",
    "pre-commit>=4.0.0",
]

docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.6.0",
]

cli = [
    "rich>=13.9.0",
    "shellingham>=1.5.4",
]

[project.urls]
Homepage = "https://github.com/ksaad20/FLDR"
Repository = "https://github.com/ksaad20/FLDR"
Issues = "https://github.com/ksaad20/FLDR/issues"

[project.scripts]
fldr = "fldr.cli:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["fldr*"]

[tool.setuptools.package-data]
fldr = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312", "py313"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "N",
    "RUF",
    "PTH",
]

ignore = [
    "D100",
    "D104",
    "D203",
    "D213",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["fldr"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.flake8]
max-line-length = 88
extend-ignore = [
    "E203",
    "W503",
]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = [
    "test_*.py",
    "*_test.py",
]

[tool.coverage.run]
branch = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
