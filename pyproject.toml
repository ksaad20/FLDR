[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "FLDR"
version = "0.1.0"
description = "Fault Line Detection in Robotics"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"

authors = [
    { name = "Kazi Saad Asif" },
]

keywords = [
    "fault-detection",
    "pipeline-inspection",
    "robotics",
    "computer-vision",
    "lidar",
    "inspection",
    "automation",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "typer>=0.12.5",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.7",
    "black>=25.0",
    "build>=1.2",
    "flake8>=7.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.12",
    "twine>=6.0",
]

[project.urls]
Homepage = "https://github.com/ksaad20/FLDR"
Repository = "https://github.com/ksaad20/FLDR"
Issues = "https://github.com/ksaad20/FLDR/issues"

[project.scripts]
fldr = "fldr.cli:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["fldr*"]
exclude = [
    "docker*",
    "tests*",
    "docs*",
    ".github*",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
]
ignore = [
    "E501",
]

[tool.flake8]
max-line-length = 88
extend-ignore = [
    "E203",
    "E501",
    "W503",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
]
addopts = "-ra --cov=fldr --cov-report=xml"

[tool.bandit]
skips = [
    "B101",
]
