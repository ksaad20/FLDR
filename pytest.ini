[pytest]
minversion = 8.0

testpaths =
    tests

python_files =
    test_*.py

python_classes =
    Test*

python_functions =
    test_*

addopts =
    -ra
    --strict-config
    --strict-markers

filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

xfail_strict = true

junit_family = xunit2

cache_dir = .pytest_cache

norecursedirs =
    .git
    .github
    .venv
    venv
    build
    dist
    .tox
    .ruff_cache
    .mypy_cache
    __pycache__

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow-running tests
